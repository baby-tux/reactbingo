version: '3'

services:
  db:
    image: mongo
    container_name: bingo-mongodb
    restart: always
    volumes:
      - ./db:/data/db

  backend:
    build:
      context: ./backend
    container_name: bingo-backend
    restart: always
    volumes:
      - ./backend/cards.csv:/app/cards.csv
    depends_on:
      - db
    links:
      - db

  frontend:
    build:
      context: ./frontend
    container_name: bingo-frontend
    restart: always
    depends_on:
      - backend
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - 3000:80
